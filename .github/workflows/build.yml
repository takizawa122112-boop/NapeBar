name: Build

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build
        shell: powershell
        run: .\build.ps1

      - name: Run protocol self-test
        shell: powershell
        run: .\build\NapeBatteryProbe.exe --self-test

      - name: Upload Windows binaries
        uses: actions/upload-artifact@v4
        with:
          name: NapeBar-win-x64
          path: |
            windows/build/NapeBar.exe
            windows/build/NapeBatteryProbe.exe
            windows/build/README.md

  mac:
    runs-on: macos-15
    defaults:
      run:
        working-directory: mac

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build
        run: ./build.sh

      - name: Upload macOS app
        uses: actions/upload-artifact@v4
        with:
          name: NapeBar-mac
          path: mac/build/NapeBar-mac.zip
