name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build
        shell: powershell
        run: .\build.ps1

      - name: Run protocol self-test
        shell: powershell
        run: .\build\NapeBatteryProbe.exe --self-test

      - name: Upload Windows binaries
        uses: actions/upload-artifact@v4
        with:
          name: NapeBar-win-x64
          path: |
            build/NapeBar.exe
            build/NapeBatteryProbe.exe
            build/README.md
