name: Release

# v0.2.0 のようなタグをpushすると、Windows版とMac版をビルドして
# 1つのGitHub Releaseに両方のzipを添付する。
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: powershell
        run: .\build.ps1

      - name: Run protocol self-test
        shell: powershell
        run: .\build\NapeBatteryProbe.exe --self-test

      - name: Package
        shell: powershell
        run: |
          $files = @('build\NapeBar.exe', 'build\NapeBatteryProbe.exe', 'build\README.md')
          Compress-Archive -Path $files -DestinationPath "build\NapeBar-${{ github.ref_name }}-win-x64.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: windows/build/NapeBar-${{ github.ref_name }}-win-x64.zip

  mac:
    runs-on: macos-15
    defaults:
      run:
        working-directory: mac
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build
        run: ./build.sh

      - name: Rename
        run: mv build/NapeBar-mac.zip "build/NapeBar-${{ github.ref_name }}-mac.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: release-mac
          path: mac/build/NapeBar-${{ github.ref_name }}-mac.zip

  release:
    needs: [windows, mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Extract release notes from CHANGELOG
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "CHANGELOG.md に $version の項目がありません" >&2; exit 1; fi

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --title "NapeBar $GITHUB_REF_NAME" \
            --notes-file notes.md
